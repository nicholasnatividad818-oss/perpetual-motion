<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-6-9 Vortex Dynamics</title>
  <style>
    :root {
      --bg: #07070c;
      --ink: #e8e4d8;
      --dim: #8a8578;
      --gold: #d4b56a;
      --ember: #c45c3a;
      --cyan: #6ec8c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
      overflow: hidden;
    }
    canvas { display: block; }
    #hud {
      position: fixed; left: 28px; bottom: 28px; z-index: 2;
      max-width: min(420px, calc(100vw - 56px));
      pointer-events: none;
    }
    #hud h1 {
      font-size: 15px; font-weight: 400; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
    }
    #hud p { font-size: 14px; line-height: 1.45; color: var(--dim); }
    #legend {
      position: fixed; left: 28px; top: 28px; z-index: 2;
      font-size: 13px; line-height: 1.7; color: var(--dim);
      pointer-events: none;
    }
    .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .sw-motion { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .sw-refuse { background: var(--ember); box-shadow: 0 0 8px var(--ember); }
    .sw-nine { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  </style>
</head>
<body>
  <div id="legend">
    <div><span class="sw sw-motion"></span>1 · 2 · 4 · 8 · 7 · 5 — motion</div>
    <div><span class="sw sw-refuse"></span>3 · 6 — oscillating polarity</div>
    <div><span class="sw sw-nine"></span>9 — still center</div>
  </div>
  <div id="hud">
    <h1>Vortex Dynamics</h1>
    <p>Drag to rotate view. Scroll to zoom.</p>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07070c, 0.028);
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(7.4, 4.2, 9.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x07070c, 1);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 5;
    controls.maxDistance = 22;
    controls.target.set(0, 0.4, 0);
    scene.add(new THREE.AmbientLight(0x3a3548, 1.1));
    const keyLight = new THREE.DirectionalLight(0xffe6c0, 1.35);
    keyLight.position.set(6, 10, 4);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x6ec8c4, 18, 24);
    fillLight.position.set(-4, 1, 3);
    scene.add(fillLight);
    const floor = new THREE.Mesh(
      new THREE.RingGeometry(3.55, 3.7, 96),
      new THREE.MeshBasicMaterial({ color: 0x1c1a22, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    const R = 3.2;
    const motionDigits = [1, 2, 4, 8, 7, 5];
    function makeGlowSprite(colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext("2d");
      const grd = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, colorHex);
      grd.addColorStop(0.35, colorHex);
      grd.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(canvas);
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    }
    function makeDigitSprite(text, color) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = color;
      ctx.font = "600 140px Georgia, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 136);
      const tex = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
      sprite.scale.set(1.1, 1.1, 1);
      return sprite;
    }
    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(R, 0.035, 16, 180),
      new THREE.MeshStandardMaterial({ color: 0x6ec8c4, emissive: 0x163a38, roughness: 0.35 })
    );
    torus.rotation.x = Math.PI / 2;
    scene.add(torus);
    motionDigits.forEach((digit, i) => {
      const angle = -Math.PI / 2 + (i / 6) * Math.PI * 2;
      const group = new THREE.Group();
      group.position.set(Math.cos(angle) * R, 0, Math.sin(angle) * R);
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xbfedec, emissive: 0x2a6e6a })
      );
      group.add(core);
      const glow = makeGlowSprite("rgba(110,200,196,0.85)");
      glow.scale.set(1.6, 1.6, 1);
      group.add(glow);
      const label = makeDigitSprite(String(digit), "#d8fffb");
      label.position.y = 0.55;
      group.add(label);
      scene.add(group);
    });
    const travelers = [];
    for (let i = 0; i < 18; i++) {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 10, 10),
        new THREE.MeshBasicMaterial({ color: 0xe8fffc })
      );
      scene.add(particle);
      travelers.push({ mesh: particle, progress: i / 18, speed: 0.06 + (i % 3) * 0.01 });
    }
    function createRefuseNode(digit) {
      const group = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.28, 1),
        new THREE.MeshStandardMaterial({ color: 0xc45c3a, emissive: 0x4a1c12, roughness: 0.3 })
      );
      group.add(core);
      const glow = makeGlowSprite("rgba(196,92,58,0.9)");
      glow.scale.set(2.4, 2.4, 1);
      group.add(glow);
      const label = makeDigitSprite(String(digit), "#ffd4c4");
      label.position.y = 0.72;
      group.add(label);
      scene.add(group);
      return group;
    }
    const node3 = createRefuseNode(3);
    const node6 = createRefuseNode(6);
    const nineGroup = new THREE.Group();
    const nineCore = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.42, 0),
      new THREE.MeshStandardMaterial({ color: 0xd4b56a, emissive: 0x5a4318, metalness: 0.45, roughness: 0.25 })
    );
    nineGroup.add(nineCore);
    const nineGlow = makeGlowSprite("rgba(212,181,106,0.95)");
    nineGlow.scale.set(3.2, 3.2, 1);
    nineGroup.add(nineGlow);
    const nineLabel = makeDigitSprite("9", "#ffe9b0");
    nineLabel.position.y = 0.95;
    nineGroup.add(nineLabel);
    nineGroup.position.set(0, 2.15, 0);
    scene.add(nineGroup);
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -2.4, 0),
      new THREE.Vector3(0, 2.15, 0)
    ]);
    scene.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0xd4b56a, transparent: true, opacity: 0.35 })));
    const filamentMat = new THREE.LineBasicMaterial({ color: 0xc45c3a, transparent: true, opacity: 0.3 });
    const fil36 = new THREE.Line(new THREE.BufferGeometry(), filamentMat);
    const fil39 = new THREE.Line(new THREE.BufferGeometry(), filamentMat.clone());
    const fil69 = new THREE.Line(new THREE.BufferGeometry(), filamentMat.clone());
    scene.add(fil36, fil39, fil69);
    function updateLine(line, p1, p2) {
      line.geometry.dispose();
      line.geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);
    }
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      controls.update();
      travelers.forEach(p => {
        p.progress = (p.progress + p.speed * 0.016) % 1;
        const a = -Math.PI / 2 + p.progress * Math.PI * 2;
        p.mesh.position.set(Math.cos(a) * R, Math.sin(t * 2 + p.progress * 12) * 0.04, Math.sin(a) * R);
      });
      const rRefuse = 4.15;
      const yAmp = 1.15;
      const a3 = t * 0.35;
      const a6 = a3 + Math.PI;
      node3.position.set(Math.cos(a3) * rRefuse, Math.sin(t * 0.9) * yAmp, Math.sin(a3) * rRefuse);
      node6.position.set(Math.cos(a6) * rRefuse, -Math.sin(t * 0.9) * yAmp, Math.sin(a6) * rRefuse);
      node3.rotation.y = t * 0.6;
      node6.rotation.y = -t * 0.6;
      nineGroup.rotation.y = t * 0.15;
      updateLine(fil36, node3.position, node6.position);
      updateLine(fil39, node3.position, nineGroup.position);
      updateLine(fil69, node6.position, nineGroup.position);
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
